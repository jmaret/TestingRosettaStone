<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · js-ui</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./signup.html">Sign up</a>
    </header>
    <main>
      <h1>Sign up</h1>
      <!-- novalidate: the UX test asserts our custom message, not the browser tooltip -->
      <form id="signup-form" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" />
        <p id="name-error" class="error" hidden>Name is required</p>
        <button type="submit">Submit</button>
      </form>
      <p id="success" class="success" hidden>Thanks for signing up</p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
