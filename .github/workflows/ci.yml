name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JS deps
        run: npm install
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Validate scenarios
        run: npm run validate:scenarios
      - name: Capture scenario results (runs each variant)
        run: npm run capture:results
      - name: Upload cached results
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results
          path: apps/web/public/results
          if-no-files-found: error
      - name: Build site
        run: npm run build
