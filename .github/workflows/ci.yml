name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JS deps
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: examples/ux/navigate-and-assert/playwright
      - name: Install pytest and httpx
        run: python3 -m pip install pytest httpx
      - name: Validate scenarios
        run: npm run validate:scenarios
      - name: Run unit, integration, and UX tests
        run: npm test
      - name: Capture scenario results (runs each variant)
        run: npm run capture:results
      - name: Upload cached results
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results
          path: apps/web/public/results
          if-no-files-found: error
      - name: Build site
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run build
      - name: Build site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build
        env:
          GITHUB_PAGES: "1"
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
